---
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  codestyle:
    runs-on: ubuntu-latest
    # Set for the whole job, not just the install step. setup-node writes an .npmrc that resolves
    # ${NODE_AUTH_TOKEN} at use time, and npm aborts with "Failed to replace env in config" when the
    # variable is missing — which would break every later step that shells out to npm or npx.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: 'Validate composer.json and composer.lock'
        run: 'composer validate'

      - name: 'Determine composer cache directory'
        id: 'determine-composer-cache-directory'
        run: 'echo "::set-output name=directory::$(composer config cache-dir)"'

      - name: 'Determine npm cache directory'
        id: 'determine-npm-cache-directory'
        run: 'echo "::set-output name=directory::$(npm config get cache)"'

      - name: Cache Composer Packages
        uses: actions/cache@v4
        env:
          cache-name: cache-composer
        with:
          path: '${{ steps.determine-composer-cache-directory.outputs.directory }}'
          key: ${{ runner.os }}-codestyle-${{ env.cache-name }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-codestyle-${{ env.cache-name }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '${{ steps.determine-npm-cache-directory.outputs.directory }}'
          key: ${{ runner.os }}-codestyle-${{ env.cache-name }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-codestyle-${{ env.cache-name }}-

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@e77cdb393f70751e0417891f9ae9de6a41096210
        with:
          php-version: '8.4'
          extensions: gd
          tools:  cs2pr, composer
        env:
          fail-fast: true

      - name: Install npm and Node
        uses: actions/setup-node@v4
        with:
          # 14.20 went end of life in 2023 and @zooroyal/itv-infrastructure declares engines
          # ">=24". 24 is also what the docker image gets from alpine, so CI and image agree.
          node-version: '24'
          # Makes npm resolve @zooroyal/* against GitHub Packages and authenticate with
          # NODE_AUTH_TOKEN, which the job sets.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zooroyal'

      - name: Install composer dependencies
        env:
          COMPOSER_PARAMETERS: ${{ matrix.composer_parameters }}
        run: |
          composer install --no-progress --no-suggest
          composer show -i

      - name: Check Coding-Standard
        run: |
          set +e
          src/bin/coding-standard sca:all
          CS_EXIT=$?
          trap "cs2pr ./tmp/checkstyle" EXIT
          exit $CS_EXIT

  tests:
    runs-on: ubuntu-latest
    needs:
      - codestyle
    # See the codestyle job for why this is job wide.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        composer_version: [2]
        composer_parameters: ['--prefer-lowest', '--prefer-stable']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: 'Validate composer.json and composer.lock'
        run: 'composer validate'

      - name: 'Determine composer cache directory'
        id: 'determine-composer-cache-directory'
        run: 'echo "::set-output name=directory::$(composer config cache-dir)"'

      - name: 'Determine npm cache directory'
        id: 'determine-npm-cache-directory'
        run: 'echo "::set-output name=directory::$(npm config get cache)"'

      - name: Cache Composer Packages
        uses: actions/cache@v4
        env:
          cache-name: cache-composer
          matrix-entries: ${{ matrix.composer_version }}-${{ matrix.composer_parameters }}
        with:
          path: '${{ steps.determine-composer-cache-directory.outputs.directory }}'
          key: ${{ runner.os }}-tests-${{ env.cache-name }}-${{ env.matrix-entries }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-tests-${{ env.cache-name }}-${{ env.matrix-entries }}-

      - name: Cache node modules
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          path: '${{ steps.determine-npm-cache-directory.outputs.directory }}'
          key: ${{ runner.os }}-tests-${{ env.cache-name }}-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-tests-${{ env.cache-name }}-

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@e77cdb393f70751e0417891f9ae9de6a41096210
        with:
          php-version: '8.4'
          tools:  composer:${{ matrix.composer_version }}
          extensions: xdebug
        env:
          fail-fast: true

      - name: Install npm and Node
        uses: actions/setup-node@v4
        with:
          # 14.20 went end of life in 2023 and @zooroyal/itv-infrastructure declares engines
          # ">=24". 24 is also what the docker image gets from alpine, so CI and image agree.
          node-version: '24'
          # Makes npm resolve @zooroyal/* against GitHub Packages and authenticate with
          # NODE_AUTH_TOKEN, which the job sets.
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zooroyal'

      - name: Install composer dependencies
        env:
          COMPOSER_PARAMETERS: ${{ matrix.composer_parameters }}
        run: |
          composer update -n --no-progress --no-suggest ${COMPOSER_PARAMETERS}
          composer show -i

      - name: Check PHPUnit
        if: ${{ matrix.composer_parameters == '--prefer-lowest' }}
        run: |
          composer test

      - name: Check infections
        if: ${{ matrix.composer_parameters == '--prefer-stable' }}
        run: |
          composer ci
